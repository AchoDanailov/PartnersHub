name: E2E

# Browser tests of the web app against a local stack. Pull requests only.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web
          npm ci --prefix e2e

      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,logflare,vector,edge-runtime

      # The web app reads VITE_*; the tests read SUPABASE_* to issue vouchers.
      - name: Export local Supabase environment
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
          } >> "$GITHUB_ENV"

      # Local-only function secrets from the committed .env.example, as in edge-functions.yml.
      # The tests read VOUCHER_ISSUER_SECRET from the environment.
      - name: Create local function secrets
        run: |
          cp supabase/functions/.env.example supabase/functions/.env
          grep -Ev '^[[:space:]]*(#|$)' supabase/functions/.env >> "$GITHUB_ENV"

      - name: Serve Edge Functions
        run: .github/scripts/serve-functions.sh

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Show Edge Runtime logs on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/functions-serve.log" || true
          npx supabase status || true
