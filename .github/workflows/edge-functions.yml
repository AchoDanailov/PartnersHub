name: Edge Functions

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/scripts/functions-task.sh"
      - ".github/workflows/edge-functions.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/scripts/functions-task.sh"
      - ".github/workflows/edge-functions.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DENO_VERSION: v2.x

jobs:
  unit:
    name: Check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/deno.json', 'supabase/functions/deno.lock') }}

      - name: Restore dependencies
        run: .github/scripts/functions-task.sh install

      - name: Type-check functions
        run: .github/scripts/functions-task.sh check

      - name: Run unit tests
        run: .github/scripts/functions-task.sh test
