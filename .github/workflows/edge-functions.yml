name: Edge Functions

on:
  push:
    branches: ["**"]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/seeding/seed.sql"
      - "supabase/config.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/scripts/**"
      - ".github/workflows/edge-functions.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/seeding/seed.sql"
      - "supabase/config.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/scripts/**"
      - ".github/workflows/edge-functions.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DENO_VERSION: v2.x

jobs:
  unit:
    name: Check and unit tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/deno.json', 'supabase/functions/deno.lock') }}

      - name: Restore dependencies
        run: .github/scripts/functions-test-cmd-builder.sh install

      - name: Type-check functions
        run: .github/scripts/functions-test-cmd-builder.sh check

      - name: Run unit tests
        run: .github/scripts/functions-test-cmd-builder.sh test

  integration:
    name: Integration tests (local stack)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Supabase CLI
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/deno.json', 'supabase/functions/deno.lock') }}

      - name: Restore dependencies
        run: .github/scripts/functions-test-cmd-builder.sh install

      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,logflare,vector,edge-runtime

      # Credentials of the supabase local stack, read by the integration tests.
      - name: Export local Supabase environment
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_FUNCTIONS_URL=$API_URL/functions/v1"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } >> "$GITHUB_ENV"

      # Local-only function secrets from the committed .env.example.
      # The local served functions read the file;
      # The integration tests read the same values from the environment. (0002-integration-tests-on-ci-against-a-local-stack.md)
      # "grep -Ev '^[[:space:]]*(#|$)'" - removes comments and empty lines.
      - name: Create local function secrets
        run: |
          cp supabase/functions/.env.example supabase/functions/.env
          grep -Ev '^[[:space:]]*(#|$)' supabase/functions/.env >> "$GITHUB_ENV"

      - name: Serve Edge Functions
        run: .github/scripts/serve-functions.sh

      - name: Run integration tests
        run: .github/scripts/functions-test-cmd-builder.sh test:integration

      - name: Show Edge Runtime logs on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/functions-serve.log" || true
          npx supabase status || true
